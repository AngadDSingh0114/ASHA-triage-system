version: "3.9"

services:
  asha-triage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./phc_central.db:/app/phc_central.db
    environment:
      - HF_HOME=/models/hf-cache
      - PORT=8000
      - ASR_MODEL=parthiv11/indic-whisper-nodcil
      - ASR_DEVICE=cpu
      - ASR_COMPUTE_TYPE=int8
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/app/phc_central.db
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
