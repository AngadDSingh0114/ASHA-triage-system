<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - PHC Central Tele-Triage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

    <!-- Ambient Glow Backgrounds -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8 relative z-10 text-white backdrop-blur-xl">
        <!-- Header Branding -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-indigo-700 text-white shadow-lg mb-3 border border-indigo-400/30">
                <i class="fa-solid fa-user-doctor text-2xl text-amber-300"></i>
            </div>
            <div class="flex items-center justify-center space-x-2 mb-1">
                <span class="bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-[10px] uppercase tracking-widest px-2.5 py-0.5 rounded-full font-bold">MoHFW / WHO IMCI</span>
                <span class="bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-[10px] uppercase tracking-widest px-2.5 py-0.5 rounded-full font-bold">Restricted</span>
            </div>
            <h2 class="text-xl font-black text-white tracking-wide">PHC Medical Officer Portal</h2>
            <p class="text-xs text-slate-400 mt-1">Authorized clinical access for triage review, case acknowledgment & emergency referral intake.</p>
        </div>

        <!-- Login Form -->
        <form id="doctorLoginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-300 mb-1.5 flex items-center">
                    <i class="fa-solid fa-id-badge mr-1.5 text-indigo-400"></i> Doctor ID / Username
                </label>
                <div class="relative">
                    <input id="loginUsername" type="text" required value="dr.anjali" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm" placeholder="e.g. dr.anjali or DOC-PUNE-01">
                    <span class="absolute right-3 top-2.5 text-slate-500"><i class="fa-solid fa-stethoscope"></i></span>
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-300 mb-1.5 flex items-center justify-between">
                    <span><i class="fa-solid fa-lock mr-1.5 text-indigo-400"></i> Medical Access Password / PIN</span>
                    <span class="text-[10px] text-indigo-400 font-normal">PIN: Doctor@123</span>
                </label>
                <div class="relative">
                    <input id="loginPassword" type="password" required value="Doctor@123" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm" placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300 focus:outline-none">
                        <i id="pwdToggleIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Error Notification Box -->
            <div id="loginErrorMsg" class="hidden p-3 bg-rose-950/80 border border-rose-600/50 rounded-xl text-rose-300 text-[11px] flex items-center">
                <i class="fa-solid fa-circle-exclamation mr-2 text-rose-400 text-sm"></i>
                <span id="loginErrorText">Invalid medical credentials.</span>
            </div>

            <!-- Quick Demo Credential Autofill -->
            <div class="pt-1">
                <button type="button" onclick="fillDemoCredentials()" class="w-full py-2 bg-slate-800/80 hover:bg-slate-800 text-amber-300 border border-amber-500/30 rounded-xl font-bold transition flex items-center justify-center space-x-2 text-[11px]">
                    <i class="fa-solid fa-key text-amber-400"></i>
                    <span>1-Click Auto-Fill Demo Credentials</span>
                </button>
            </div>

            <!-- Submit Button -->
            <button id="loginSubmitBtn" type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                <i class="fa-solid fa-right-to-bracket mr-1"></i>
                <span>Secure Doctor Log In</span>
            </button>

            <!-- Navigation link to ASHA app -->
            <div class="text-center pt-2">
                <a href="/index.html" class="text-slate-400 hover:text-indigo-300 text-[11px] inline-flex items-center transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Switch to Frontline ASHA Companion
                </a>
            </div>
        </form>

        <!-- Security Badge Footer -->
        <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-400">
            <span class="flex items-center"><i class="fa-solid fa-shield-halved text-emerald-400 mr-1.5"></i> Protected Health Information</span>
            <span class="font-mono">Khed Sub-District PHC</span>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById("loginPassword");
            const icon = document.getElementById("pwdToggleIcon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                icon.className = "fa-solid fa-eye-slash";
            } else {
                pwdInput.type = "password";
                icon.className = "fa-solid fa-eye";
            }
        }

        function fillDemoCredentials() {
            document.getElementById("loginUsername").value = "dr.anjali";
            document.getElementById("loginPassword").value = "Doctor@123";
            const errBox = document.getElementById("loginErrorMsg");
            if (errBox) errBox.classList.add("hidden");
        }

        async function handleLoginSubmit(event) {
            if (event) event.preventDefault();
            const username = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPassword").value.trim();
            const errBox = document.getElementById("loginErrorMsg");
            const errText = document.getElementById("loginErrorText");
            const btn = document.getElementById("loginSubmitBtn");

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying Medical Credentials...`;

            try {
                const res = await fetch('/api/doctor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success && data.token) {
                    sessionStorage.setItem("phc_doctor_token", data.token);
                    sessionStorage.setItem("phc_doctor_info", JSON.stringify(data.doctor));
                    window.location.href = "/phc_dashboard.html";
                } else {
                    errText.innerText = data.error || "Authentication failed. Invalid Username or PIN.";
                    errBox.classList.remove("hidden");
                }
            } catch (e) {
                errText.innerText = "Error connecting to PHC server: " + e;
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-right-to-bracket mr-1"></i> Secure Doctor Log In`;
            }
        }
    </script>
</body>
</html>
